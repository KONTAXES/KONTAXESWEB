name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SA_ADMIN_PASSWORD: ${{ secrets.VITE_SA_ADMIN_PASSWORD }}

      - name: Package dist
        run: cd dist && zip -r ../deploy.zip .

      - name: Upload to cPanel via HTTPS API
        env:
          CPANEL_HOST: ${{ secrets.FTP_SERVER }}
          CPANEL_USER: ${{ secrets.FTP_USERNAME }}
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Uploading deploy.zip to public_html..."
          UPLOAD=$(curl -k --fail --max-time 120 --silent \
            -u "${CPANEL_USER}:${CPANEL_PASS}" \
            -F "dir=/public_html" \
            -F "file-1=@deploy.zip" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/upload_files")
          echo "Upload: $UPLOAD"

          echo "Extracting zip on server..."
          EXTRACT=$(curl -k --fail --max-time 60 --silent \
            -u "${CPANEL_USER}:${CPANEL_PASS}" \
            -X POST \
            --data-urlencode "dir=/public_html" \
            --data-urlencode "files[0]=deploy.zip" \
            --data-urlencode "type=zip" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/extract_file")
          echo "Extract: $EXTRACT"

          echo "Removing zip..."
          curl -k --max-time 30 --silent \
            -u "${CPANEL_USER}:${CPANEL_PASS}" \
            -X POST \
            --data-urlencode "dir=/public_html" \
            --data-urlencode "files[0]=deploy.zip" \
            --data-urlencode "discard_trash=1" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/delete_files"

          echo "Deploy complete!"
